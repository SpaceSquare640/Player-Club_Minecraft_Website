      label: "Name / 名稱"
      description: "1-60 characters. / 1–60 字。"
    validations:
      required: true
  - type: "markdown"
    attributes:
      value: "**Tags by dimension / 各維度可用標籤**\n\n| Tag / 標籤 | Overworld / 主世界 | The Nether / 地獄 | The End / 終界 | Editions / 版本 |\n| --- | :-: | :-: | :-: | --- |\n| Spawn / 出生點 (`spawn`) | ✓ | — | — | All / 全部 |\n| Base / 基地 (`base`) | ✓ | ✓ | ✓ | All / 全部 |\n| Farm / 農場 (`farm`) | ✓ | ✓ | ✓ | All / 全部 |\n| Nether Portal / 地獄傳送門 (`nether_portal`) | ✓ | ✓ | — | All / 全部 |\n| Village / 村莊 (`village`) | ✓ | — | — | All / 全部 |\n| Stronghold / 要塞 (`stronghold`) | ✓ | — | — | All / 全部 |\n| End Portal / 終界傳送門 (`end_portal`) | ✓ | — | — | All / 全部 |\n| Ocean Monument / 海底神殿 (`ocean_monument`) | ✓ | — | — | All / 全部 |\n| Woodland Mansion / 林地府邸 (`woodland_mansion`) | ✓ | — | — | All / 全部 |\n| Ancient City / 遠古城市 (`ancient_city`) | ✓ | — | — | All / 全部 |\n| Trial Chambers / 試煉密室 (`trial_chambers`) | ✓ | — | — | All / 全部 |\n| Monster Spawner / 怪物生成器 (`spawner`) | ✓ | ✓ | — | All / 全部 |\n| Nether Fortress / 地獄要塞 (`nether_fortress`) | — | ✓ | — | All / 全部 |\n| Bastion Remnant / 堡壘遺跡 (`bastion`) | — | ✓ | — | All / 全部 |\n| End City / 終界城 (`end_city`) | — | — | ✓ | All / 全部 |\n| Biome / 生態域 (`biome`) | ✓ | ✓ | ✓ | All / 全部 |\n| Other / 其他 (`other`) | ✓ | ✓ | ✓ | All / 全部 |"
  - type: "dropdown"
    id: "tags"
    attributes:
      label: "Tags / 標籤"
      description: "At least one tag; each tag must be allowed in the chosen dimension (see the table above). / 至少一個標籤，且須符合所選維度（見上表）。"
      multiple: true
      options:
