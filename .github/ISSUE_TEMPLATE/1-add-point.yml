body:
  - type: "markdown"
    attributes:
      value: "**One point per issue.** Everything you submit is public, and your GitHub account is shown as the submitter.\n**一個 Issue 只提交一筆座標。** 提交內容會公開，你的 GitHub 帳號將顯示為提交者。\n\nHow to get coordinates: in Java Edition press F3 and copy the `XYZ` or `Block` line; in Bedrock Edition turn on Show Coordinates. Paste the whole line into **F3 coordinates**, or fill in **X / Y / Z** instead.\n取得座標：Java 版按 F3 複製 `XYZ` 或 `Block` 那一行；基岩版開啟「顯示座標」。將整行貼到「F3 座標整串」，或改填 X / Y / Z。\n\nNo GitHub account? Join our Discord and ask the owner to add it for you: https://discord.gg/aaUQVJeCgC\n沒有 GitHub 帳號？請加入 Discord，由擁有者代為登錄：https://discord.gg/aaUQVJeCgC"
  - type: "dropdown"
    id: "world"
    attributes:
      label: "World / 世界"
      options:
        - "Player_Club (player_club)"
        - "Builder World (builder_world)"
    validations:
      required: true
  - type: "dropdown"
    id: "dimension"
    attributes:
      label: "Dimension / 維度"
      options:
        - "Overworld / 主世界 (overworld)"
        - "The Nether / 地獄 (the_nether)"
        - "The End / 終界 (the_end)"
    validations:
      required: true
  - type: "input"
    id: "name"
