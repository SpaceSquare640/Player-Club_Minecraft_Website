# Generated by scripts/gen-issue-forms.mjs from site/data. Do not edit by hand; run npm run gen:forms.
name: "Edit a point / 修改座標"
description: "Request changes to an existing point. / 申請修改既有座標。"
title: "[Edit / 修改] "
labels:
  - "coord-request"
  - "type:edit"
body:
  - type: "input"
    id: "target_id"
    attributes:
      label: "Point ID / 座標 ID"
      description: "Use the card menu on the website to prefill it, e.g. p0001. / 可由網站卡片選單預填，例如 p0001。"
      placeholder: "p0001"
    validations:
      required: true
  - type: "markdown"
    attributes:
      value: "Leave a field empty to keep it unchanged. Enter `-` in **Y** or **Note** to clear it. The world cannot be changed.\n欄位留空表示不變；Y 或說明填 `-` 表示清除。無法更換世界。\n\nChoosing tags replaces all tags. Filling **F3 coordinates** replaces X, Y and Z together.\n選擇標籤會整組取代原標籤；填寫 F3 座標會整組取代 X、Y、Z。"
  - type: "dropdown"
    id: "dimension"
    attributes:
      label: "Dimension / 維度"
      options:
        - "Overworld / 主世界 (overworld)"
        - "The Nether / 地獄 (the_nether)"
        - "The End / 終界 (the_end)"
  - type: "input"
    id: "name"
    attributes:
      label: "Name / 名稱"
  - type: "markdown"
    attributes:
      value: "**Tags by dimension / 各維度可用標籤**\n\n| Tag / 標籤 | Overworld / 主世界 | The Nether / 地獄 | The End / 終界 | Editions / 版本 |\n| --- | :-: | :-: | :-: | --- |\n| Spawn / 出生點 (`spawn`) | ✓ | — | — | All / 全部 |\n| Base / 基地 (`base`) | ✓ | ✓ | ✓ | All / 全部 |\n| Farm / 農場 (`farm`) | ✓ | ✓ | ✓ | All / 全部 |\n| Nether Portal / 地獄傳送門 (`nether_portal`) | ✓ | ✓ | — | All / 全部 |\n| Village / 村莊 (`village`) | ✓ | — | — | All / 全部 |\n| Stronghold / 要塞 (`stronghold`) | ✓ | — | — | All / 全部 |\n| End Portal / 終界傳送門 (`end_portal`) | ✓ | — | — | All / 全部 |\n| Ocean Monument / 海底神殿 (`ocean_monument`) | ✓ | — | — | All / 全部 |\n| Woodland Mansion / 林地府邸 (`woodland_mansion`) | ✓ | — | — | All / 全部 |\n| Ancient City / 遠古城市 (`ancient_city`) | ✓ | — | — | All / 全部 |\n| Trial Chambers / 試煉密室 (`trial_chambers`) | ✓ | — | — | All / 全部 |\n| Monster Spawner / 怪物生成器 (`spawner`) | ✓ | ✓ | — | All / 全部 |\n| Nether Fortress / 地獄要塞 (`nether_fortress`) | — | ✓ | — | All / 全部 |\n| Bastion Remnant / 堡壘遺跡 (`bastion`) | — | ✓ | — | All / 全部 |\n| End City / 終界城 (`end_city`) | — | — | ✓ | All / 全部 |\n| Biome / 生態域 (`biome`) | ✓ | ✓ | ✓ | All / 全部 |\n| Other / 其他 (`other`) | ✓ | ✓ | ✓ | All / 全部 |"
  - type: "dropdown"
    id: "tags"
    attributes:
      label: "Tags / 標籤"
      description: "Replaces all tags when filled. / 填寫即整組取代。"
      multiple: true
      options:
        - "Spawn / 出生點 (spawn)"
        - "Base / 基地 (base)"
        - "Farm / 農場 (farm)"
        - "Nether Portal / 地獄傳送門 (nether_portal)"
        - "Village / 村莊 (village)"
        - "Stronghold / 要塞 (stronghold)"
        - "End Portal / 終界傳送門 (end_portal)"
        - "Ocean Monument / 海底神殿 (ocean_monument)"
        - "Woodland Mansion / 林地府邸 (woodland_mansion)"
        - "Ancient City / 遠古城市 (ancient_city)"
        - "Trial Chambers / 試煉密室 (trial_chambers)"
        - "Monster Spawner / 怪物生成器 (spawner)"
        - "Nether Fortress / 地獄要塞 (nether_fortress)"
        - "Bastion Remnant / 堡壘遺跡 (bastion)"
        - "End City / 終界城 (end_city)"
        - "Biome / 生態域 (biome)"
        - "Other / 其他 (other)"
  - type: "input"
    id: "f3"
    attributes:
      label: "F3 coordinates / F3 座標整串"
      description: "Replaces X, Y and Z together; do not fill X / Y / Z at the same time. / 整組取代 X、Y、Z，請勿同時填寫 X / Y / Z。"
      placeholder: "XYZ: 7.534 / 103.00000 / 5.699"
  - type: "input"
    id: "x"
    attributes:
      label: "X"
  - type: "input"
    id: "y"
    attributes:
      label: "Y"
      description: "Enter - to clear. / 填 - 表示清除。"
  - type: "input"
    id: "z"
    attributes:
      label: "Z"
  - type: "textarea"
    id: "note"
    attributes:
      label: "Note / 說明"
      description: "Enter - to clear. / 填 - 表示清除。"
  - type: "textarea"
    id: "reason"
    attributes:
      label: "Reason (optional) / 原因（選填）"
      description: "Not saved to the data. / 不會寫入資料。"
  - type: "checkboxes"
    id: "confirm"
    attributes:
      label: "Confirmation / 確認"
      options:
        - label: "These changes may be made public, and my GitHub account will be shown in this issue. / 修改內容可公開，且我的 GitHub 帳號將顯示於此 Issue。"
          required: true
