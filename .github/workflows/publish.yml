# Checks and publishes pushes to Source_Code.
# check: validation (X18 compares with the commit before the push) and unit tests; nothing is deployed
# when it fails, so the site keeps the previous version.
# forms-check / forms: the Issue Forms are generated in forms-check (contents: read, no token), which
# hands the changes to forms as a git patch in a job output. forms (contents: write) runs no Node.js and
# no npm: it checks that the patch only changes .yml files directly in .github/ISSUE_TEMPLATE/, commits it
# on the commit it was made from and pushes. It has its own issue-forms-writer queue: sharing one with
# apply-approved would let a pending forms job replace (cancel) a pending apply job. A push that races
# with another writer is rejected and retried (see the step comment).
# forms-recover: when the forms on Source_Code changed while forms ran (a conflict), it starts one more run
# of this workflow (forms_recovery=true) that regenerates them; a recovery run never starts another.
# deploy: the reusable Pages deployment (always the current Source_Code HEAD).
# Commits pushed with GITHUB_TOKEN (the bot) do not trigger this workflow.
name: Publish

on:
  push:
    branches: [Source_Code]
    paths:
      - "site/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      forms_recovery:
        description: Set by forms-recover after an Issue Forms conflict; such a run never starts another
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate data and run tests
        env:
          PCMW_BASELINE_REF: ${{ github.event.before }}
        run: npm run check:ci

  forms-check:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.forms.outputs.stale }}
      base: ${{ steps.forms.outputs.base }}
      patch: ${{ steps.forms.outputs.patch }}
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Source_Code
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The patch is a job output (base64 of a git diff, a few kB): no extra action is needed, and the size
      # is kept well below the job output and environment variable limits.
      - name: Compare the Issue Forms with the data and prepare a patch
        id: forms
        run: |
          if node scripts/gen-issue-forms.mjs --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/gen-issue-forms.mjs
          git add -- .github/ISSUE_TEMPLATE
          patch="$(git diff --cached --full-index -- .github/ISSUE_TEMPLATE | base64 -w0)"
          if [ -z "$patch" ]; then
            echo "::error::The Issue Forms are out of date, but regenerating them changed nothing"
            exit 1
          fi
          if [ "${#patch}" -gt 100000 ]; then
            echo "::error::The Issue Forms patch is too large for a job output"
            exit 1
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

  forms:
    needs: forms-check
    if: needs.forms-check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: issue-forms-writer
      cancel-in-progress: false
    outputs:
      conflict: ${{ steps.push.outputs.conflict }}
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Source_Code
          fetch-depth: 0
          persist-credentials: false

      # This job runs git and shell only (no Node.js, no npm), and this step has no token. Every file in
      # the patch must be a .yml file directly in .github/ISSUE_TEMPLATE/, changed or added as a regular
      # file (no rename, copy, deletion, mode change, symbolic link or binary data); the paths are checked
      # in the patch before it is applied and in the index after. The patch is applied to the commit it was
      # made from; the commit message and identity are fixed here, never taken from the patch.
      - name: Check and commit the Issue Forms patch
        env:
          FORMS_BASE: ${{ needs.forms-check.outputs.base }}
          FORMS_PATCH: ${{ needs.forms-check.outputs.patch }}
        run: |
          allowed='\.github/ISSUE_TEMPLATE/[A-Za-z0-9_-][A-Za-z0-9._-]*\.yml'
          if ! printf '%s' "$FORMS_BASE" | grep -Eqx '[0-9a-f]{40}([0-9a-f]{24})?'; then
            echo "::error::The base of the Issue Forms patch is not a commit SHA"
            exit 1
          fi
          if ! git -c core.hooksPath=/dev/null merge-base --is-ancestor "$FORMS_BASE" HEAD; then
            echo "::error::The base of the Issue Forms patch is not part of Source_Code"
            exit 1
          fi
          patch_file="$RUNNER_TEMP/issue-forms.patch"
          printf '%s' "$FORMS_PATCH" | base64 -d > "$patch_file"
          if grep -Eq '^(rename|copy) (from|to) |^(old|new) mode |^deleted file mode |^similarity index |^GIT binary patch|^Binary files ' "$patch_file" \
            || grep -E '^new file mode ' "$patch_file" | grep -qvx 'new file mode 100644' \
            || grep -E '^diff --git ' "$patch_file" | grep -Eqvx "diff --git a/($allowed) b/\\1" \
            || grep -E '^(---|\+\+\+) ' "$patch_file" | grep -Eqvx -e "--- a/$allowed|\+\+\+ b/$allowed|--- /dev/null"; then
            echo "::error::The Issue Forms patch changes more than .yml files in .github/ISSUE_TEMPLATE/"
            exit 1
          fi
          paths="$(git -c core.hooksPath=/dev/null apply --numstat "$patch_file" | cut -f3)"
          if [ -z "$paths" ] || printf '%s\n' "$paths" | grep -Eqvx "$allowed"; then
            echo "::error::The Issue Forms patch changes more than .yml files in .github/ISSUE_TEMPLATE/"
            exit 1
          fi
          git -c core.hooksPath=/dev/null checkout -q --detach "$FORMS_BASE"
          git -c core.hooksPath=/dev/null apply --index "$patch_file"
          staged="$(git -c core.hooksPath=/dev/null diff --cached --name-only)"
          if [ -z "$staged" ] || printf '%s\n' "$staged" | grep -Eqvx "$allowed"; then
            echo "::error::The staged changes are not limited to .yml files in .github/ISSUE_TEMPLATE/"
            exit 1
          fi
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(forms): regenerate issue forms"

      # The token is given to this step only (never stored in .git/config); it runs git only, with hooks
      # turned off. A rejected push (Source_Code moved on) fetches and moves the one forms commit onto the
      # remote head (rebase --onto its parent), at most 3 more times; after the move exactly that commit may
      # lie ahead of the remote, touching .github/ISSUE_TEMPLATE/ only. Only an owner push changes what the
      # generator reads (world names and ids, tags, dictionaries, config), and such a push runs this workflow again.
      # When the move conflicts (the forms on Source_Code changed meanwhile), the job ends with conflict=true
      # and forms-recover starts one more run that regenerates them; in that run a conflict fails the job.
      - name: Push the Issue Forms
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          FORMS_RECOVERY: ${{ inputs.forms_recovery }}
        run: |
          auth_b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_b64"
          auth_header="http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth_b64"
          remote=refs/remotes/origin/Source_Code
          for attempt in 1 2 3 4; do
            if git -c core.hooksPath=/dev/null -c "$auth_header" push origin HEAD:refs/heads/Source_Code; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); moving the forms commit onto the remote Source_Code"
            git -c core.hooksPath=/dev/null -c "$auth_header" fetch origin +refs/heads/Source_Code:$remote
            if ! git -c core.hooksPath=/dev/null merge-base --is-ancestor HEAD~1 "$remote"; then
              echo "::error::The parent of the Issue Forms commit is not part of the remote Source_Code"
              exit 1
            fi
            if ! git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              rebase --onto "$remote" HEAD~1; then
              git -c core.hooksPath=/dev/null rebase --abort || true
              if [ "$FORMS_RECOVERY" = "true" ]; then
                echo "::error::The Issue Forms conflict again in the recovery run; run this workflow manually"
                exit 1
              fi
              echo "::warning::The Issue Forms on Source_Code changed meanwhile; a new run regenerates them"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ahead="$(git -c core.hooksPath=/dev/null rev-list --count "$remote..HEAD")"
            if [ "$ahead" = 0 ]; then
              echo "The remote Source_Code already has these Issue Forms"
              exit 0
            fi
            changed="$(git -c core.hooksPath=/dev/null diff --name-only "$remote" HEAD)"
            if [ "$ahead" != 1 ] || [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qv '^\.github/ISSUE_TEMPLATE/[^/]*$'; then
              echo "::error::After the move, more than the Issue Forms commit would be pushed"
              exit 1
            fi
          done
          echo "::error::Could not push the regenerated Issue Forms"
          exit 1

  # After a conflict, one more run of this workflow (forms_recovery=true) regenerates the Issue Forms from
  # the current Source_Code. Only this job holds actions: write, it runs one API call and no code from the
  # repository, and it never runs in a recovery run, so a conflict can start at most one more run.
  forms-recover:
    needs: forms
    if: needs.forms.outputs.conflict == 'true' && inputs.forms_recovery != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow again to regenerate the Issue Forms
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" -f ref=Source_Code -f "inputs[forms_recovery]=true"

  deploy:
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      expected_sha: ${{ github.sha }}
