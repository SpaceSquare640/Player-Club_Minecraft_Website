# Writes approved coordinate requests to Source_Code, deploys the site and reports back on the Issues.
# Issue content is read only by scripts/apply-requests.mjs from REST responses; it is never interpolated
# into this workflow. Only the apply job keeps the checkout token, because it pushes the bot commits.
# A pending run in the source-code-writer queue may be replaced by a newer one; every run scans all
# approved Issues, and the daily schedule catches anything left over.
name: Apply approved requests

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    if: github.event_name != 'issues' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    concurrency:
      group: source-code-writer
      cancel-in-progress: false
    outputs:
      needs_deploy: ${{ steps.apply.outputs.needs_deploy }}
      results: ${{ steps.apply.outputs.results }}
      head_sha: ${{ steps.apply.outputs.head_sha }}
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Source_Code
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply approved requests
        id: apply
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/apply-requests.mjs`);
            await run({ github, context, core });

  deploy:
    needs: apply
    if: needs.apply.outputs.needs_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      expected_sha: ${{ needs.apply.outputs.head_sha }}

  report:
    needs: [apply, deploy]
    if: always() && needs.apply.result == 'success' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out Source_Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Source_Code
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Report the deployment on the Issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          APPLY_RESULTS: ${{ needs.apply.outputs.results }}
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/apply-requests.mjs`);
            await report({ github, context, core });
